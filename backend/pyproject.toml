[project]
name = "claimlens"
version = "0.1.0"
description = "ClaimLens AI-Based Misinformation Detection System"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "spacy>=3.7.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.0",
    "langdetect>=1.0.9",
    "sentencepiece>=0.2.0",
    "lxml>=5.0.0",
    "lxml_html_clean>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
